<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f5e9">
  <meta name="description" content="Visense，把一瞬灵感，留给下一次创作。">
  <title>Visense · 你的随身灵感口袋</title>
  <link rel="icon" href="assets/logo浅色.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo浅色.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="device.css">
  <link rel="stylesheet" href="theme.css">
  <script src="device.js" defer></script>
  <script src="store.js" defer></script>
  <script src="assets/photo-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="device-stage">
  <div class="device-footprint" id="device-footprint">
  <div class="iphone-device" id="iphone-device" aria-label="iPhone 16 交互样机">
    <span class="device-button action-button" aria-hidden="true"></span>
    <span class="device-button volume-up" aria-hidden="true"></span>
    <span class="device-button volume-down" aria-hidden="true"></span>
    <span class="device-button power-button" aria-hidden="true"></span>
    <span class="device-button camera-button" aria-hidden="true"></span>
  <div class="app-shell" id="app-shell">
    <div class="ios-status-bar" aria-hidden="true">
      <time class="ios-time" id="ios-time">9:41</time>
      <div class="dynamic-island"><span class="island-camera"></span></div>
      <div class="ios-indicators">
        <svg class="cellular-indicator" viewBox="0 0 20 14"><rect x="0" y="9" width="3.1" height="5" rx=".9"/><rect x="5" y="6.3" width="3.1" height="7.7" rx=".9"/><rect x="10" y="3.2" width="3.1" height="10.8" rx=".9"/><rect x="15" y="0" width="3.1" height="14" rx=".9"/></svg>
        <svg class="wifi-indicator" viewBox="0 0 18 14"><path d="M1.2 4.3a11.4 11.4 0 0 1 15.6 0M4.1 7.6a7 7 0 0 1 9.8 0M7 10.8a2.9 2.9 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="9" cy="13" r="1"/></svg>
        <svg class="battery-indicator" viewBox="0 0 29 14"><rect x=".6" y=".6" width="24" height="12.8" rx="3.5" fill="none" stroke="currentColor" stroke-opacity=".42" stroke-width="1.2"/><rect x="2.5" y="2.5" width="18" height="9" rx="1.7"/><path d="M26.1 4.5v5a2.8 2.8 0 0 0 0-5Z" opacity=".55"/></svg>
      </div>
    </div>
    <main id="app" aria-label="Visense"><div class="boot"><img class="boot-logo" data-theme-logo src="assets/logo浅色.png" alt="Visense Logo" width="88" height="88"><strong>Visense</strong><p>把灵感，留在身边。</p></div></main>
    <nav id="nav" class="bottom-nav" aria-label="主导航" hidden></nav>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden>
    <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
    <input id="restore-input" type="file" accept="application/json,.json" hidden>
    <div class="ios-home-area" aria-hidden="true"><span></span></div>
  </div>
  </div>
  </div>
  <p class="device-caption" aria-hidden="true">iPhone 16 <span>·</span> 393 × 852</p>
  </div>
  <noscript>请启用 JavaScript 以使用 Visense。</noscript>
</body>
</html>
